name: Cluster Net Tests

on:
  push:
    paths:
      - "include/kv/cluster/**"
      - "include/kv/net/**"
      - "src/cluster/**"
      - "src/net/**"
      - "tests/cluster/**"
      - "tests/net/**"
      - ".github/workflows/cluster-net-tests.yml"
  pull_request:
    paths:
      - "include/kv/cluster/**"
      - "include/kv/net/**"
      - "src/cluster/**"
      - "src/net/**"
      - "tests/cluster/**"
      - "tests/net/**"
      - ".github/workflows/cluster-net-tests.yml"
  workflow_dispatch:

jobs:
  cluster-net-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: Configure
        run: cmake --preset debug

      - name: Build targeted tests
        run: cmake --build --preset debug --target kv_net_test kv_cluster_test

      - name: Run cluster and net tests
        run: >
          ctest --test-dir build --output-on-failure
          -R 'CommandParserTest|CommandExecutorTest|SessionTest|ServerIntegrationTest|ClusterManagerTest'
