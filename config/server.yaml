# KV Server Configuration
#
# Environment variables (take precedence):
#   KV_RAFT=1                     Enable Raft consensus
#   KV_RAFT_NODE_ID=1             This node's ID
#   KV_RAFT_PORT=9528             Raft RPC port
#   KV_RAFT_DATA_DIR=data/raft    Raft data directory
#   KV_RAFT_PEERS=1:127.0.0.1:9528,2:127.0.0.1:9628,3:127.0.0.1:9728
#   KV_CLUSTER_NODES=id:local,host:127.0.0.1,port:9527,weight:1,alive:true;id:peer2,host:127.0.0.1,port:9528,weight:1,alive:true
#   KV_CACHE=1                    Enable cache
#   KV_CACHE_CAPACITY=1024        Cache capacity
#   KV_CACHE_TTL_MS=0             Default TTL (0=no expiry)
#   KV_METRICS_PORT=9090          Prometheus/health HTTP port (0=disabled)

server:
  port: 9527
  # Prometheus/health HTTP port; 0 disables the endpoint.
  metrics_port: 0
  db_path: data/db

storage:
  sync_on_write: false
  memtable_write_buffer_size: 4194304
  compaction_min_input_files: 2
  auto_compaction_enabled: true

raft:
  enabled: false
  node_id: 1
  raft_port: 9528
  data_dir: data/raft
  peers:
    - id: 1
      host: 127.0.0.1
      raft_port: 9528
    - id: 2
      host: 127.0.0.1
      raft_port: 9628
    - id: 3
      host: 127.0.0.1
      raft_port: 9728

cache:
  enabled: false
  policy: lru
  capacity: 1024
  ttl_ms: 0

cluster:
  local_node_id: local
  nodes:
    - id: local
      host: 127.0.0.1
      port: 9527
      weight: 1
      alive: true
